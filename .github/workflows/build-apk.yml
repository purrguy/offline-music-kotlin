name: build-apk

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Public read-only key fallback is in code; set repo secret to override.
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure SDK packages (runner has SDK preinstalled)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle --version
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi
      - name: Build debug APK (system gradle, no wrapper needed)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: offline-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
