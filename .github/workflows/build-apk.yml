name: build-apk

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Public read-only key fallback is in code; set repo secret to override.
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Show versions
        run: |
          java -version
          gradle --version || true
          sdkmanager --list_installed || true
      - name: Build debug APK (system gradle, no wrapper needed)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: offline-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
